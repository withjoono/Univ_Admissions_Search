name: Deploy Backend
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate credentials and policy without deployment or Cloud Build'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-search-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CONFIG: ${{ secrets.BACKEND_APP_YAML_B64 }}
        run: |
          test -n "$PROVIDER" && test -n "$ACCOUNT" && test -n "$CONFIG" || { echo 'Missing deployment authentication or configuration.'; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ts-back-nest-479305
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate app.yaml from secret
        working-directory: search-backend
        env:
          CONFIG: ${{ secrets.BACKEND_APP_YAML_B64 }}
        run: |
          umask 077
          printf '%s' "$CONFIG" | base64 -d > app.yaml
      - name: Install policy test dependency
        run: npm install --prefix "$RUNNER_TEMP/pool-policy-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Enforce shared DB connection budget
        working-directory: search-backend
        env:
          NODE_PATH: ${{ runner.temp }}/pool-policy-tools/node_modules
        run: |
          python -m pip install PyYAML==6.0.3
          python test-connection-budget.py
          node test-pool-runtime.cjs
          python apply-connection-policy.py app.yaml
          python apply-connection-policy.py app.yaml --check

      - name: Verify deployment authentication and permissions (read only)
        working-directory: search-backend
        run: python verify-deployment-readiness.py
      - name: Deploy to App Engine
        if: ${{ !inputs.validate_only }}
        working-directory: search-backend
        run: gcloud app deploy app.yaml --project=ts-back-nest-479305 --quiet
      - name: Remove temporary configuration
        if: always()
        working-directory: search-backend
        run: rm -f -- app.yaml
